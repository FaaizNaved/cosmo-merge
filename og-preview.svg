<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070814" />
      <stop offset="50%" stop-color="#0f1128" />
      <stop offset="100%" stop-color="#04050d" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="earthGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <radialGradient id="holeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#030712" />
      <stop offset="90%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Stars -->
  <circle cx="150" cy="120" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="380" cy="80" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="850" cy="140" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="1020" cy="90" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="220" cy="480" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="950" cy="520" r="2" fill="#ffffff" opacity="0.8" />

  <!-- Celestial Bodies Illustrations -->
  <!-- Sun -->
  <circle cx="320" cy="380" r="90" fill="url(#sunGlow)" />
  <circle cx="320" cy="380" r="80" fill="#f97316" opacity="0.9" />

  <!-- Earth -->
  <circle cx="200" cy="240" r="55" fill="url(#earthGlow)" />
  <ellipse cx="200" cy="240" rx="75" ry="18" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7" transform="rotate(-20 200 240)" />

  <!-- Black Hole / Singularity -->
  <circle cx="880" cy="320" r="110" fill="url(#holeGlow)" />
  <ellipse cx="880" cy="320" rx="150" ry="38" fill="none" stroke="#c084fc" stroke-width="5" transform="rotate(30 880 320)" />

  <!-- Title & Branding -->
  <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="4">
    COSMO MERGE
  </text>
  <text x="600" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#38bdf8" letter-spacing="6">
    PLANETARY 2048 PHYSICS GAME
  </text>

  <!-- Tagline -->
  <text x="600" y="370" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" fill="#94a3b8">
    Drop, Collide &amp; Evolve Celestial Bodies into Supernovas and Black Holes
  </text>

  <!-- CTA Pill -->
  <rect x="460" y="420" width="280" height="60" rx="30" fill="#6366f1" />
  <text x="600" y="458" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#ffffff">
    PLAY FREE ONLINE
  </text>
  <text x="600" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#64748b">
    cosmo-merge.vercel.app
  </text>
</svg>
